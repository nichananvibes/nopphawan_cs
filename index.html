<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora's Magical Loy Krathong</title><style>*{box-sizing:border-box}body{margin:0;background:#170d35;color:#fff;font-family:Tahoma,sans-serif;text-align:center}h1{font-family:Georgia,serif;color:#ffe0a3;font-size:clamp(25px,5vw,48px);margin:20px 0 5px}p{color:#f8d9f3}main{max-width:1000px;margin:auto;padding:12px}.scene{position:relative;overflow:hidden;border-radius:25px;border:1px solid #e6b9df;box-shadow:0 0 40px #b66ad855;background:#24134b}.scene svg{display:block;width:100%;height:auto}.panel{background:#ffffff0c;border:1px solid #ffffff30;border-radius:22px;padding:20px;margin:18px auto;max-width:650px}textarea,input,button{font:inherit;border-radius:12px;padding:12px;border:1px solid #e5b5dc}textarea,input{width:100%;background:#30204d;color:white;margin:6px 0}button{cursor:pointer;background:#f6c5e7;color:#421c52;margin:5px}button.active{background:#ffdb89;outline:2px solid white}button.primary{background:linear-gradient(100deg,#f8d78c,#ef9edb);font-weight:bold}.float{position:absolute;bottom:4%;left:48%;font-size:clamp(24px,5vw,48px);filter:drop-shadow(0 0 12px gold);animation:sail 12s ease-out forwards;pointer-events:none}@keyframes sail{to{transform:translate(28vw,-90px) scale(.45);opacity:.65}}.star{animation:twinkle 2s infinite alternate}@keyframes twinkle{to{opacity:.25}}#result{white-space:pre-wrap;overflow-wrap:anywhere;color:#ffe0a3}small{color:#d7b8e3}</style><main><h1>Aurora’s Magical Loy Krathong</h1><p>คืนแห่งคำอธิษฐาน ณ ปราสาทเจ้าหญิงออโรร่า</p><div class="scene" id="scene"><svg viewBox="0 0 900 510" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ปราสาทเทพนิยาย เจ้าหญิง แบมแบมในรูปการ์ตูน สุนัขและกระต่ายริมสระ"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#160e40"/><stop offset="1" stop-color="#a75b9c"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#633e86"/><stop offset="1" stop-color="#151c46"/></linearGradient><linearGradient id="wall"><stop stop-color="#a76bb6"/><stop offset=".5" stop-color="#f4c6df"/><stop offset="1" stop-color="#9866b4"/></linearGradient><radialGradient id="moon"><stop stop-color="#fffbdc"/><stop offset=".7" stop-color="#ffe4b4"/><stop offset="1" stop-color="#ffe4b400"/></radialGradient></defs><rect width="900" height="510" fill="url(#sky)"/><circle cx="720" cy="100" r="90" fill="url(#moon)"/><g id="stars" fill="#fff1cc"/><path d="M0 310 Q130 210 260 310 T520 310 T900 290 V510 H0" fill="#33244e"/><g fill="url(#wall)" stroke="#f6bddd" stroke-width="2"><rect x="300" y="210" width="300" height="140"/><rect x="390" y="125" width="120" height="225"/><rect x="270" y="170" width="65" height="180"/><rect x="565" y="170" width="65" height="180"/><rect x="350" y="205" width="45" height="145"/><rect x="505" y="205" width="45" height="145"/></g><g fill="#703d94" stroke="#f0b4d8" stroke-width="2"><path d="M375 125 L450 30 525 125Z"/><path d="M258 170 L302 90 347 170Z"/><path d="M553 170 L598 90 642 170Z"/><path d="M340 205 L372 145 405 205Z"/><path d="M495 205 L528 145 560 205Z"/></g><g fill="#ffdf91"><path d="M450 30 V8 L478 17 450 25"/><path d="M302 90 V65 L326 74 302 82"/><path d="M598 90 V65 L622 74 598 82"/><rect x="440" y="150" width="20" height="38" rx="10"/><rect x="290" y="192" width="22" height="42" rx="11"/><rect x="587" y="192" width="22" height="42" rx="11"/><rect x="340" y="260" width="22" height="42" rx="11"/><rect x="538" y="260" width="22" height="42" rx="11"/></g><path d="M420 350 V300 Q450 250 480 300 V350" fill="#58345f"/><rect y="365" width="900" height="145" fill="url(#water)"/><g stroke="#eab4db" opacity=".35" stroke-width="3"><path d="M310 390h280 M350 410h200 M280 435h340 M380 460h140 M50 480h180 M650 470h200"/></g><path d="M0 350 Q130 320 280 370 L250 395 H0Z M900 350 Q760 320 650 370 L680 395 H900Z" fill="#41354e"/><g transform="translate(155 250)"><ellipse cx="0" cy="30" rx="28" ry="36" fill="#eac26d"/><circle cy="22" r="21" fill="#ffdfc4"/><path d="M-22 12 Q0 -15 22 12 Q0 2 -22 25" fill="#eac26d"/><path d="M-18 45 L18 45 58 120 Q0 140 -58 120Z" fill="#ed8ec7" stroke="#ffd2ef" stroke-width="3"/><path d="M-15 0 L-18 -14 0 -5 18 -14 15 0Z" fill="#ffdc7a"/><circle cx="-7" cy="23" r="2"/><circle cx="7" cy="23" r="2"/><path d="M-5 32 Q0 36 5 32" fill="none" stroke="#a35d6b"/></g><g transform="translate(760 245)"><path d="M-20 85 L-24 132 M20 85 L24 132" stroke="#20213a" stroke-width="16"/><path d="M-28 43 Q0 30 28 43 L35 92 H-35Z" fill="#f3f0f5"/><path d="M-28 43 L-40 80 M28 43 L40 80" stroke="#f3f0f5" stroke-width="13"/><circle cy="20" r="23" fill="#f4d1bd"/><path d="M-24 20 Q-30 -15 5 -8 Q32 -7 24 22 L12 3 -5 14 -16 8Z" fill="#30233c"/><circle cx="-7" cy="22" r="2"/><circle cx="7" cy="22" r="2"/><path d="M-5 31 Q0 35 5 31" fill="none" stroke="#a35d6b"/><text y="-22" fill="#caffc4" font-size="14" text-anchor="middle">BamBam ♡</text></g><text x="45" y="379" font-size="47">🐶</text><text x="220" y="382" font-size="40">🐇</text><text x="660" y="380" font-size="36">🐇</text><text x="810" y="382" font-size="40">🐶</text><text x="380" y="420" font-size="30">🪷</text><text x="540" y="450" font-size="36">🪷</text></svg></div><div class="panel"><h2>ฝากคำอธิษฐานกับแสงจันทร์</h2><div id="choices"><button class="active" data-k="🪷">🪷 บัวชมพู</button><button data-k="🌸">🌸 ดอกไม้เจ้าหญิง</button><button data-k="🌼">🌼 กระทงทอง</button></div><input id="name" maxlength="60" placeholder="ชื่อของคุณ (ไม่บังคับ)"><textarea id="wish" rows="3" maxlength="500" placeholder="เขียนคำอธิษฐานของคุณ..."></textarea><button class="primary" id="launch">✨ ลอยกระทง</button><button id="share">แชร์เว็บไซต์</button><p id="result" role="status" aria-live="polite"></p><small>คำอธิษฐานแสดงเฉพาะในหน้าจอของคุณ ไม่ส่งไปยังเซิร์ฟเวอร์</small></div><small>Fan-made fantasy experience • ไม่ใช่เว็บไซต์ทางการของศิลปินหรือ Disney</small></main><script>const $=id=>document.getElementById(id);for(let i=0;i<95;i++){let c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',Math.random()*900);c.setAttribute('cy',Math.random()*280);c.setAttribute('r',.6+Math.random()*1.8);c.setAttribute('class','star');c.style.animationDelay=Math.random()*3+'s';$('stars').append(c)}let k='🪷';document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{k=b.dataset.k;document.querySelectorAll('[data-k]').forEach(x=>x.classList.toggle('active',x===b))});$('launch').onclick=()=>{let f=document.createElement('span');f.className='float';f.textContent=k+'🕯️';$('scene').append(f);setTimeout(()=>f.remove(),12000);$('result').textContent=($('name').value.trim()||'นักเดินทางแห่งเทพนิยาย')+' ขอให้ทุกคำอธิษฐานเป็นจริง 💖\n'+$('wish').value};$('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else{await navigator.clipboard.writeText(location.href);$('result').textContent='คัดลอกลิงก์แล้ว'}}catch(e){if(e.name!=='AbortError')$('result').textContent='แชร์ลิงก์จากแถบที่อยู่ของเบราว์เซอร์ได้เลย'}};</script></html>
